<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="言咒 EX-004 暗酒红二维牌桌与对手手部静态构图，HTML-04。">
<title>言咒 · 布局与交互基准</title>



<link rel="stylesheet" href="art/reference-skin/skin.css">
</head>
<body>

<div class="app"><div class="table-props" aria-hidden="true" id="table-props"></div>
<header class="topbar"><div class="brand">言咒</div><span class="layout-edition">基准</span><div class="round-read"><small>回合</small><span id="round">02</span></div><div class="phase-block"><i class="phase-dot"></i><span id="phase">最终整理</span></div><div class="beat-read" id="beat"></div><div class="fatigue-read" id="fatigue"></div><details class="preview-tools"><summary aria-label="示意设置" title="示意设置">⋯</summary><div class="preview-popover"><label for="scene">示意状态</label><select id="scene" aria-label="示意状态"><option value="arrange">第二轮 · 最终整理</option><option value="ready">开场 · 就绪</option><option value="production">第二轮 · 生产暂停</option><option value="ended">第二轮 · 结算完成</option><option value="fatigue">第十轮 · 疲劳待处理</option></select><p>位置示意 · 固定状态。点击查看，拖牌整理；切换状态会重置。</p><button class="control" id="reset" type="button">重置示意</button><label class="skin-option"><input id="decor-toggle" type="checkbox" checked>桌缘陈设</label><label class="skin-option"><input id="layout-guides" type="checkbox">区域标注</label><label class="skin-option"><input id="opponent-toggle" type="checkbox" checked>对手手部</label></div></details></header>
<main class="counter-scene" aria-label="前台牌局与近侧法器工作台">
<section class="front-counter layout-region" data-region="前台 · 两行五位" aria-label="前台牌面"><span class="engraving front-engraving" aria-hidden="true">本轮牌局</span><section class="battle" aria-label="本轮战斗行"><div class="lane opponent-lane"><div class="opponent-presence" aria-hidden="true"></div><div class="lane-label"><span class="seal enemy-seal" title="敌方 · 炼金学徒" aria-label="敌方 · 炼金学徒">敌</span></div><div class="cards" id="enemy-cards" aria-label="敌方五位行"></div><aside class="side-note" id="enemy-note" aria-label="已生成的公开后续"></aside></div><div class="lane"><div class="lane-label"><span class="seal" aria-label="玩家战斗行">我</span></div><div class="cards" id="player-cards" aria-label="玩家五位行"></div></div></section></section>
<aside class="supply-rack layout-region" data-region="三个资源卡堆" aria-label="资源区，三个卡堆造型占位，未接入资源库存"><span class="rack-title">资源</span><div class="resource-piles" id="resource-piles"></div></aside>
<aside class="counter-dock layout-region" data-region="敌我筹码" aria-label="筹码托盘"><div class="counter-zone" aria-label="敌上我下的筹码区"><div class="counter-line"><span class="counter-owner">敌</span><div id="enemy-counters"></div></div><div class="counter-line"><span class="counter-owner">我</span><div id="player-counters"></div></div></div></aside>
<section class="workbench layout-region" data-region="近侧 · 法器工作台" aria-label="法器工作台，两台法器及两处预留"><div class="bench-surface" aria-hidden="true"><i class="bench-corner corner-left"></i><i class="bench-corner corner-right"></i><span class="engraving">施术台</span></div><div class="artifact-zone"><div class="artifact-grid" id="artifacts"></div></div><div class="bench-setting"><span>下一批</span><button id="bench-mode" type="button" aria-label="切换施法法器的未来用途"></button></div></section>
<section class="hand-dock layout-region" data-region="手牌卡堆" aria-label="手边留牌"><div class="hand-zone"><div class="hand-heading"><span class="hand-cap" id="hand-capacity" aria-label="手牌容量">3 / 3</span><div class="ap" aria-label="剩余整理点"><span class="ap-label">整理</span><span class="ap-value" id="ap">2</span><span class="ap-dots" id="ap-dots" aria-hidden="true"></span></div></div><button class="hand-pile card-pile" id="hand-pile" type="button" aria-label="展开手牌卡堆" aria-expanded="false" aria-controls="hand-fan" data-focus="hand-pile"></button><div class="hand-fan" id="hand-fan" hidden><div class="fan-heading"><span>手牌</span><button id="hand-fold" type="button" aria-label="收起手牌">×</button></div><div class="hand-cards" id="hand-cards" aria-label="跨轮手牌"></div></div></div></section>
</main>
<footer class="bottom-bar"><div class="context-note" id="context" role="status"></div><button class="control" id="arrange" type="button">整理</button><button class="control" id="apply" type="button" hidden>确认整理 · 1点</button><button class="control" id="step" type="button">单步</button><button class="control primary" id="primary" type="button">确认结算</button></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="detail" aria-labelledby="dialog-title"><button class="dialog-close" type="button" aria-label="关闭详情">×</button><div id="dialog-content"></div></dialog>
<script src="art/reference-skin/skin.js"></script>
<script src="fixtures.js"></script>
<script src="interactions.js"></script>
</body></html>
