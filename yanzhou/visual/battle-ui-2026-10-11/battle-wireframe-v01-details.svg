<text x="1674" y="756" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">继续 [空格]</text>
<text x="993" y="890" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">打开设置 / 说明 → 暂停 → 关闭后仍暂停 → 明确继续</text>
<text x="993" y="937" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">普通对象详情：本稿建议打开时暂停，关闭后仍暂停。</text>
<text x="993" y="980" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">关闭展开区，焦点返回原对象；必要信息支持点击与键盘。</text>
<text x="993" y="1023" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">恢复存档后进入暂停，保留已结清步骤与已提交操作。</text>
<text x="993" y="1057" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge" fill="#555555">速度档位、每拍秒数及自动暂停触发暂留 TL-Q08。</text>
<text x="49" y="1126" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">结构约定：对象详情只开一处；底部法器 / 队列保持锚点，展开区使用中部反馈空间。</text>
<text x="49" y="1163" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">这一步只评审位置、层级与入口；不选材质 / 配色，不做组件美术、模型或战斗实现。</text>
