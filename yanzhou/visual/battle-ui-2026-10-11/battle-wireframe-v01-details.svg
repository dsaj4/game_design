<text x="1010" y="299" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">锁定施法护符②；到期中断此器当时的1个批次。</text>
<text x="993" y="375" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">当前普通批次：6 → 9拍，R1，可先完成。</text>
<text x="993" y="416" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">危险开工带：[10,12]（D3）；新批次仍可能被打断。</text>
<text x="993" y="457" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">可取消条件：有明示权限的取消行动，实际生效须早于T13。</text>
<text x="993" y="494" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">本套组没有取消行动；显示说明，不设置即时取消按钮。</text>
