<text x="72" y="931" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="22" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">若成功且未终局：再记1 → 实有10 / 锁定5 / 可消费5。</text>
<text x="72" y="977" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" fill="#222222">锁定 / 解锁在观察窗口受理；只约束自动消费。</text>
<text x="72" y="1031" font-family="Microsoft YaHei, Segoe UI Symbol, sans-serif" font-size="21" font-weight="400" dominant-baseline="text-before-edge" fill="#555555">没有冻结、待释放或未来登记时，收起对应的空账目。</text>
