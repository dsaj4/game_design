<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">言咒组件几何更正与文本分组约束 v01</title><desc id="desc">效果板局部偏差的确定性工程说明：守护外环连续、内环开口；护盾币六段缺口；施法币为正圆菱印加下半锁箍；近观批次、数量和错误为独立纸页。</desc>
<defs><linearGradient id="bronze"><stop stop-color="#6e552f"/><stop offset=".5" stop-color="#c3a46a"/><stop offset="1" stop-color="#725a34"/></linearGradient><mask id="six"><rect width="1600" height="1000" fill="white"/><g fill="black"><rect x="1092" y="145" width="17" height="28"/><rect x="1092" y="145" width="17" height="28" transform="rotate(60 1100 245)"/><rect x="1092" y="145" width="17" height="28" transform="rotate(120 1100 245)"/><rect x="1092" y="145" width="17" height="28" transform="rotate(180 1100 245)"/><rect x="1092" y="145" width="17" height="28" transform="rotate(240 1100 245)"/><rect x="1092" y="145" width="17" height="28" transform="rotate(300 1100 245)"/></g></mask></defs>
<style>text{font-family:'Microsoft YaHei',sans-serif;fill:#dcd3bc}.heading{font-size:25px;fill:#e1c993}.body{font-size:20px}.small{font-size:17px;fill:#aaa994}.ink{fill:#312d22}.guide{fill:none;stroke:#b5a070;stroke-width:1.5}.panel{fill:#202a23;stroke:#62644f;stroke-width:1}.paper{fill:#dfd0ad;stroke:#937c54;stroke-width:1.5}</style>
<rect width="1600" height="1000" fill="#151d18"/>
<text x="42" y="49" class="heading">组件几何更正 · v01</text><text x="400" y="49" class="body">代码原生约束图，不替代效果板；发生冲突时按本图与 brief 制作。</text>
<rect x="30" y="78" width="755" height="408" rx="8" class="panel"/>
<text x="55" y="115" class="heading">WAND-01 · 连续外环 / 顶部开口内环</text>
<circle cx="235" cy="266" r="102" fill="none" stroke="url(#bronze)" stroke-width="20"/>
<path d="M217 197A71 71 0 1 0 253 197" fill="none" stroke="#bca16a" stroke-width="8" stroke-linecap="butt"/>
<path d="M334 251L392 259V284L334 296Z" fill="url(#bronze)" stroke="#d0b67e"/>
<circle cx="347" cy="264" r="5" fill="#2a3025"/><circle cx="347" cy="285" r="5" fill="#2a3025"/><circle cx="376" cy="272" r="5" fill="#2a3025"/>
<path d="M393 261H485V284H393Z" fill="#3c5944" stroke="#92977a"/>
<path d="M235 151V130H458M235 183V167H478M286 222L389 201H478" class="guide"/>
<text x="487" y="137" class="body">外环完整连续</text><text x="487" y="174" class="body">内环顶部开口</text><text x="487" y="209" class="body">两环之间保留气隙</text>
<text x="91" y="410" class="body">不采用 v02 主图中外环的裂口。</text><text x="91" y="447" class="small">尺寸、壁厚、颈座装配按 brief；环截面和本图共同限定几何。</text>
<rect x="805" y="78" width="765" height="408" rx="8" class="panel"/>
<text x="831" y="115" class="heading">CHIP-02 · 正反一致的六段缺口</text>
<circle cx="1100" cy="245" r="94" fill="url(#bronze)" stroke="#d3b77d" stroke-width="3" mask="url(#six)"/>
<circle cx="1100" cy="245" r="75" fill="#597279" stroke="#2b4144" stroke-width="4"/>
<path d="M1062 218L1100 207L1138 218V254Q1128 280 1100 298Q1072 281 1062 254Z" fill="#3c5962" stroke="#b3bbb0" stroke-width="3"/>
<path d="M1100 213V287M1071 236H1129" stroke="#c6c9b7" stroke-width="3"/>
<text x="1242" y="211" class="body">每 60° 一处缺口</text><text x="1242" y="248" class="body">厚 3 mm</text><text x="1242" y="285" class="body">背面与侧缘随正面修正</text>
<text x="865" y="405" class="body">不采用 v02 旧背面 / 局部图中的多齿外轮廓。</text><text x="865" y="445" class="small">生命币仍为十二齿；两类筹码不能只换色。</text>
<rect x="30" y="506" width="755" height="465" rx="8" class="panel"/>
<text x="55" y="548" class="heading">TXT-03 · 三种独立页面，不能混作同一功能</text>
<g><rect x="60" y="603" width="210" height="270" class="paper"/><rect x="55" y="596" width="220" height="13" fill="#785335"/><rect x="55" y="868" width="220" height="13" fill="#785335"/><text x="81" y="646" class="body ink">当前批次 #1</text><text x="81" y="690" class="small ink">开工 0 → 完工 2</text><text x="81" y="728" class="small ink">承诺：简易护盾</text><text x="81" y="766" class="small ink">D 2 · 剩余 1</text><text x="81" y="804" class="small ink">无需材料</text></g>
<g><rect x="300" y="603" width="210" height="270" class="paper"/><rect x="295" y="596" width="220" height="13" fill="#785335"/><rect x="295" y="868" width="220" height="13" fill="#785335"/><text x="324" y="646" class="body ink">消费锁数量</text><text x="318" y="690" class="small ink">实有 9 / 可用 6</text><text x="318" y="728" class="small ink">当前锁定 3</text><rect x="371" y="751" width="68" height="42" fill="#efe2bf" stroke="#866f47"/><text x="397" y="781" class="body ink">3</text><text x="324" y="834" class="small ink">草稿需明确提交</text></g>
<g><rect x="540" y="603" width="210" height="270" class="paper"/><rect x="535" y="596" width="220" height="13" fill="#785335"/><rect x="535" y="868" width="220" height="13" fill="#785335"/><text x="562" y="646" class="body ink">保存失败</text><text x="562" y="690" class="small ink">旧档仍有效</text><text x="562" y="728" class="small ink">当前结果在内存</text><text x="562" y="766" class="small ink">重试同一结果</text><circle cx="726" cy="810" r="23" fill="#853a2b" stroke="#b47a52"/><text x="722" y="818" class="body">!</text></g>
<text x="59" y="927" class="small">不采用效果板左页“批次信息与消费锁混排”的功能布局；正文用运行字体。</text>
<rect x="805" y="506" width="765" height="465" rx="8" class="panel"/>
<text x="831" y="548" class="heading">CHIP-03 · 正圆铜币 / 菱形压印 / 下半锁箍</text>
<g><circle cx="1015" cy="742" r="88" fill="url(#bronze)" stroke="#cbb07b" stroke-width="3"/><circle cx="1015" cy="742" r="73" fill="none" stroke="#644d2a" stroke-width="3"/><path d="M1015 683L1061 742L1015 801L969 742Z" fill="none" stroke="#ecd099" stroke-width="4"/><path d="M1015 704V780M985 742H1045" stroke="#574527" stroke-width="3"/></g>
<g><circle cx="1354" cy="742" r="88" fill="url(#bronze)" stroke="#cbb07b" stroke-width="3"/><circle cx="1354" cy="742" r="73" fill="none" stroke="#644d2a" stroke-width="3"/><path d="M1354 683L1400 742L1354 801L1308 742Z" fill="none" stroke="#ecd099" stroke-width="4"/><path d="M1269 766Q1354 781 1439 766V792Q1354 807 1269 792Z" fill="#414942" stroke="#969b85" stroke-width="2"/><rect x="1333" y="770" width="43" height="34" rx="3" fill="#657061" stroke="#c1b996" stroke-width="2"/><path d="M1347 781H1362M1354 778V797" stroke="#28352d" stroke-width="3"/></g>
<text x="991" y="870" class="body">可用</text><text x="1327" y="870" class="body">锁定</text><text x="850" y="923" class="small">前视必须正圆；不采用 v02 前视拉长椭圆。锁箍是可拆独立件，不烘在币上。</text>
</svg>
