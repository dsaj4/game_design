<header><small>言咒 / PHYSICAL-CARD-ART-01 / 2026.10.12</small><h1>让效果落在物件上。</h1><p>战斗桌面、悬浮近观、守护牌的一次生效。首批美术候选，沿用 HTML v04 的结构与已选材质风格。</p><nav><a href="#tabletop">01 桌面总览</a><a href="#closeups">02 悬浮近观</a><a href="#sequence">03 卡片过程</a><a href="README.md">说明与检查</a></nav></header>
<main>
<figure id="tabletop"><span class="num">01 / TABLETOP</span><h2>第0拍，桌面静止</h2><p class="muted">正向筹码在棋子右侧；无负面状态时左侧留空。常态隐藏数量，零量保留空托。</p><a href="01-tabletop.png" target="_blank" rel="noopener"><img src="01-tabletop.png" width="1672" height="941" alt="言咒第0拍战斗桌面，r4暗牌与T6攻击牌，玩家行为空，正向筹码在棋子右侧"></a><figcaption>七列0—6；r4在第4刻，攻击10在T6。点击图片查看原尺寸。</figcaption></figure>
<figure id="closeups"><span class="num">02 / FLOATING OBJECTS</span><h2>物件展开，背景留给桌面</h2><p class="muted">四种独立情境的近观。法器用环计时，右侧默认材料；棋子、暗牌、空资源都无详情底板。</p><a href="02-floating-closeups.png" target="_blank" rel="noopener"><img src="02-floating-closeups.png" width="1672" height="941" loading="lazy" alt="法器半圈倒计时，棋子生命30护盾0，程序2暗牌r4，空资源的四种悬浮近观"></a><figcaption>四分格只用于画稿对照，不是游戏内四块面板。上划产物态另待制作。</figcaption></figure>
<figure id="sequence"><span class="num">03 / CARD SEQUENCE</span><h2>先防护，再记次，最后离场</h2><p class="muted">跟随同一张守护牌：2拍入列，保持正面待效，3拍自动获得护盾，再增加施法次数。</p><a href="03-shield-sequence.png" target="_blank" rel="noopener"><img src="03-shield-sequence.png" width="1672" height="941" loading="lazy" alt="守护牌G02在2拍完工待效，3拍护盾加4，次数加1后离场的四帧示意"></a><figcaption>终态生命30、护盾4、次数1。局部动作分镜未绘同拍其他产物，不作为全桌布局或暂停动画。</figcaption></figure>
</main>
