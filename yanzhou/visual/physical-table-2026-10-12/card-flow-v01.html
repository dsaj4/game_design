 }
 if(id==='guard'||id==='caster'){
  const w=snap.wands[id];showDialog(subject[id],`<div class="hero"><div class="hero-icon">${icon(id)}</div></div>`,`<span class="eyebrow">${id==='guard'?'环杖':'蓝晶杖'} · 当前批次</span><h3>${w.label}</h3><div class="detail-row">${pill('冻结D',w.D)}${pill('完工拍',w.finish)}${pill('材料','无需材料')}</div><div class="flow">${flowNode(id,subject[id])}<span class="flow-arrow">→</span>${flowNode(id==='guard'?'shield':'attack',w.purpose)}</div><p class="detail-note">当前承诺：${w.purpose}。未来设置与当前批次分开；改变未来用途不会改写已入行牌。</p>`);return;
 }
 if(id==='player'||id==='enemy'){
  const hp=id==='player'?snap.hp:snap.enemyHp,armor=id==='player'?snap.armor:0;
  showDialog(subject[id],`<div class="hero"><div class="hero-icon">${icon(id)}</div></div>`,`<span class="eyebrow">最近结清的当前状态</span><div class="detail-row">${pill('生命',hp)}${pill('护甲',armor)}</div><div class="flow">${flowNode('shield','先抵挡普通伤害')}<span class="flow-arrow">→</span>${flowNode(id,'超出扣生命')}</div><div class="detail-row">${pill('下次共同疲劳',snap.fatigueBeat===null?'已终局':snap.fatigueBeat+'拍')}${snap.fatigue!==null?pill('双方各损失',snap.fatigue):''}</div>`);return;
 }
 if(id==='mark'){
  showDialog('施法次数',`<div class="hero stamp"><div class="hero-icon">${icon('mark')}</div></div>`,`<span class="eyebrow">自有标记 · 精确账目</span><div class="detail-row">${pill('实有',snap.marks)}${pill('可用',snap.marks-snap.locked)}${pill('锁定',snap.locked)}</div><div class="flow">${flowNode('mark','已到账层数')}<span class="flow-arrow">→</span>${flowNode('lock','锁定量不供自动消费')}</div><p class="detail-note">未来新增量不属于当前余额。筹码形状辅助识别，数值以此处账目为准。</p>`);return;
 }
 if(id==='drawer'){showDialog('资源抽屉',`<div class="hero"><div class="empty-drawer" aria-hidden="true"><span></span><span></span><span></span></div></div>`,`<span class="eyebrow">当前投入</span><h3>无需材料 · 资源为空</h3><div class="detail-row">${pill('本场材料',0)}</div><p class="detail-note">抽屉内没有可取用材料。格数只表现收纳形制。</p>`);return;}
 if(id==='history'){showDialog('已发生记录',`<div class="hero stamp"><div class="hero-icon">${icon('history')}</div></div>`,`<span class="eyebrow">原拍与实际顺序 · 不占Q</span><div class="mini-list">${snap.history.map((e,i)=>`<button type="button" data-record="${e.id}">${eventSymbol(e)} ${i+1} · ${e.beat}拍<br>${esc(e.label)}</button>`).join('')}</div><p class="detail-note">选择图形记录查看完整原因，查看不会重新演出。</p>`);return;}
 showDialog('队列为空',`<div class="hero stamp"><div class="hero-icon">${icon('empty')}</div></div>`,`<h3>尚无真实队首</h3><p class="detail-note">预留和待复用是容量状态，不是可以查看或出牌的卡。</p>`);
}
function openRecord(id){if(!detail.open)sourceFocus=document.activeElement?.id?.startsWith('motion-')?'strip-'+id:document.activeElement?.id||'strip-'+id;const e=findRecord(id);if(!e)return;pause();showDialog('已发生 · '+e.label,`<div class="hero stamp"><div class="hero-icon">${icon(e.type)}</div></div>`,`<span class="eyebrow">历史记录 · 不占队列容量</span><div class="detail-row">${pill('原拍',e.beat)}${pill('顺序',snap.history.findIndex(x=>x.id===id)+1)}${e.amount!==null?pill('实际量',e.amount):''}${e.card?.side==='player'?pill('原牌入行',e.card.arrival+'拍'):''}</div><div class="flow">${flowNode(e.card?.source||'history',e.card?(subject[e.card.source]||'卡片来源'):'共同事件')}<span class="flow-arrow">→</span>${flowNode(e.target==='both'?'time':e.target, e.target==='both'?'双方共同结清':subject[e.target]||e.target)}</div><div class="steps">${tile(snap.history.findIndex(x=>x.id===id)+1,eventSymbol(e),e.label)}</div><p class="detail-note">${esc(e.note||'结果已经结清，查看不会重新支付、使用或演出。')}</p>`,'object','历史只读 · 关闭后仍暂停');}
function openSystem(kind){
 if(!detail.open)sourceFocus=document.activeElement?.id||'control-settings';pause();
 if(kind==='result'){
  const won=snap.terminal==='win';showDialog(won?'战斗胜利':'战斗失败',`<div class="hero stamp"><div class="hero-icon">${icon(won?'win':'loss')}</div></div>`,`<span class="eyebrow">第${snap.beat}拍 · 同一终局结果</span><h3 class="result-name">${won?'回退攻击致胜':'共同疲劳 · 双亡'}</h3><p class="result-sub">${won?'不足5层，实际回退6伤；未继续记次或疲劳10。':'双方同时结清疲劳15；同点双亡，玩家失败。'}</p><div class="detail-row">${pill('玩家生命',snap.hp)}${pill('玩家护甲',snap.armor)}${pill('敌生命',snap.enemyHp)}${pill('施法次数',snap.marks)}</div><p class="detail-note">以上为清理后当前状态；最后事件保留在历史中。没有等待卡片落地或补做后续步骤。</p>`,'result','终局静态结果 · 无新音画','<button type="button" class="secondary" data-dialog-action="close">查看桌面记录</button> <button type="button" data-dialog-action="retry">重试同配置</button>');return;
 }
 if(kind==='save'||kind==='read'){
  fault=kind;showDialog(kind==='save'?'保存失败':'读取失败',`<div class="hero stamp"><div class="hero-icon">${icon('save')}</div></div>`,`<span class="eyebrow">存档状态</span><div class="flow">${flowNode('history','同一已结清状态')}<span class="flow-arrow">${kind==='save'?'→':'←'}</span>${flowNode('error','未完成')}</div><h3>${kind==='save'?'已保留结果，等待重试':'原存档保持不变'}</h3><p class="detail-note">${kind==='save'?'当前处于暂停；后续不可逆提交已停止。重试不会重新结算本次结果。':'没有覆盖原存档，也没有自动开始新战。可返回原页面后重新选择。'}</p>`,'error',kind==='save'?'同一结果 · 重试不重算':'读取失败不覆盖',kind==='save'?'<button type="button" data-dialog-action="retry-save">重试保存</button>':'<button type="button" data-dialog-action="return-read">返回原页面</button>');render();return;
 }
 showDialog('设置',`<div class="hero stamp"><div class="hero-icon">${icon('settings')}</div></div>`,`<span class="eyebrow">打开设置已暂停</span><label class="setting-row"><input type="checkbox" id="modalReduced" ${reduced?'checked':''}>减动效：直接显示静态结果</label><div class="detail-row">${pill('播放速度',speed+'×')}${pill('打断揭示','自动暂停')}</div><p class="detail-note">关闭后保持暂停。桌沿继续控件或P才会推进。</p>`,'settings');
}
function closeDialog(){const isSave=fault==='save';if(fault==='read')fault=null;detail.close();modalKind=null;paused=true;if(isSave)snap.notice='保存尚未成功 · 从存档物件重新打开并重试';render();const source=$(sourceFocus)||$('obj-'+selectedId)||$('control-play')||$('control-settings');if(source&&!source.disabled)source.focus({preventScroll:true});else $('control-settings').focus();announce('已关闭，保持暂停');}
board.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.object){sourceFocus=button.id;openObject(button.dataset.object);return;}
 if(button.dataset.record){openRecord(button.dataset.record);return;}
 switch(button.dataset.action){case'play':play();break;case'step':step();break;case'left':browse(-1);break;case'right':browse(1);break;case'home':home();break;case'speed':{const current=pendingSpeed??speed;pendingSpeed=current===1?2:current===2?.5:1;render();announce(`已请求${pendingSpeed}倍速，下一个观察窗口生效`);break;}case'settings':openSystem(fault|| (snap.terminal?'result':'settings'));break;}
});
$('presentation').addEventListener('click',e=>{const moving=e.target.closest('[data-motion-card]');if(!moving)return;const id=moving.dataset.motionCard,record=moving.dataset.motionRecord;if(findCard(id)){sourceFocus='obj-'+id;openObject(id);}else if(record){sourceFocus='strip-'+record;openRecord(record);}});
detail.addEventListener('click',e=>{const record=e.target.closest('[data-record]');if(record){openRecord(record.dataset.record);return;}const b=e.target.closest('[data-dialog-action]');if(!b)return;switch(b.dataset.dialogAction){case'close':closeDialog();break;case'retry':closeDialog();loadScenario('new');break;case'retry-save':fault=null;snap.notice='保存重试成功 · 同一结果，仍暂停';closeDialog();announce(snap.notice);break;case'return-read':fault=null;closeDialog();break;}});
detail.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
detail.addEventListener('change',e=>{if(e.target.id==='modalReduced'){reduced=e.target.checked;$('reduceMotion').checked=reduced;render(false);}});
document.addEventListener('keydown',e=>{
 if(detail.open)return;
 if(e.target.closest('input,select,textarea,.review'))return;
 if(e.repeat&&[' ','p','P'].includes(e.key)){e.preventDefault();return;}
 const key=e.key.toLowerCase();
 if(['p',' ','arrowleft','arrowright','home','escape','1','2','c','d','l'].includes(key))e.preventDefault();
 if(key==='p')play();else if(key===' ')step();else if(key==='arrowleft')browse(-1);else if(key==='arrowright')browse(1);else if(key==='home')home();else if(key==='escape')openSystem(fault||(snap.terminal?'result':'settings'));else if(key==='1')openObject('guard');else if(key==='2')openObject('caster');else if(key==='c')openObject(snap.players[0]?.id||'empty');else if(key==='d')openObject('drawer');else if(key==='l')openObject('mark');
});
$('scenario').innerHTML=Object.entries(Object.groupBy?Object.groupBy(scenarios,x=>x.group):scenarios.reduce((a,x)=>{(a[x.group]??=[]).push(x);return a;},{})).map(([group,list])=>`<optgroup label="${esc(group)}">${list.map(x=>`<option value="${x.id}">${x.label}</option>`).join('')}</optgroup>`).join('');
$('scenario').addEventListener('change',e=>loadScenario(e.target.value));
$('replay').addEventListener('click',()=>{loadScenario(scenario.id,true);$('control-play').focus();});
$('reduceMotion').addEventListener('change',e=>{reduced=e.target.checked;render(false);});
window.addEventListener('blur',()=>{if(!paused)pause('窗口失焦 · 返回后仍暂停');else if(detail.open){snap.notice='返回后仍暂停 · 近观保持';render(false);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause('窗口不可见 · 返回后仍暂停');});
window.addEventListener('resize',()=>render(false));
loadScenario('new');
</script>
</body>
</html>
