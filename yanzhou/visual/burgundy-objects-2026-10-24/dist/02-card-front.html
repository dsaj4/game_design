<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>言咒 · 独立对象审阅</title><link rel="stylesheet" href="review.css"></head><body data-page="object" data-object="02-card-front"><header></header><main class="review-layout"><section class="workspace" aria-label="对象预览"><div class="workspace-bar"><div class="workspace-title"><span id="object-number" class="object-num"></span><h1 id="object-title"></h1></div><div class="tabs" role="tablist" aria-label="预览方式"><button role="tab" data-mode="native" aria-selected="true">HTML 样稿</button><button role="tab" data-mode="raster" aria-selected="false">效果图</button></div></div><div id="stage" class="stage" data-background="dark"><span id="stage-mark" class="stage-mark">HTML · 可调样稿</span><div id="native" class="native-preview"></div><div id="raster" class="raster-preview" hidden><img id="effect-image" alt=""></div></div><div class="workspace-foot"><span id="focus"></span><div id="object-actions" class="object-action"></div><a id="image-link" target="_blank" rel="noopener">打开原图 ↗</a></div></section><aside class="inspector" aria-label="审阅与批注"><h2>HTML 参数</h2><div id="native-controls" class="native-controls"></div><p class="readonly-note">效果图保留生成原貌；参数只调整 HTML 样稿。</p><button id="reset-parameters" class="reset">重置参数</button><hr><div class="control-row"><label class="control-label" for="background">预览底色</label><select id="background"><option value="dark">暗底</option><option value="light">浅底</option><option value="grid">透明网格</option></select></div><hr><h2>本项批注</h2><textarea id="note" aria-label="本项批注" placeholder="例如：金边再细一点，纹饰减少。"></textarea><div class="note-actions"><button id="save-note">保存批注与参数</button><button id="export-note">导出批注</button></div><p id="saved" class="saved" role="status"></p><p class="tiny">批注自动保存在本机当前浏览器。导出后可交回修改；不会自动采纳或组装。</p><nav id="item-nav" class="item-nav" aria-label="相邻对象"></nav></aside></main><dialog id="detail" aria-label="对象详情"><div id="detail-body"></div><button id="close-detail">关闭</button></dialog><div id="toast" class="toast" hidden role="status"></div><script src="review.js"></script></body></html>
