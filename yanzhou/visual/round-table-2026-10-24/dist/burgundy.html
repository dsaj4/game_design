function cardFace(card,{dark=false,detail=false}={}){const d=definitions[card.kind];if(dark){const category=card.kind==='R'?'⊘ 打断':'▲ 攻击',time=['C','R'].includes(card.kind)?'延时':'即时';return backSkin()+'<span class="card-type" title="'+category+'" aria-label="'+category+'">'+category[0]+'</span><span class="card-effect">'+time+'</span>'+(detail?'<span class="card-after">尚未公开</span>':'');}const after=['G','A','B'].includes(card.kind)?'✦ +1':card.kind==='E'?'→ 玩家':card.kind==='D'?'→ 法器':['R','C'].includes(card.kind)?'次轮':'即时';const effect=({G:'◇ <b>+4</b>',A:'▲ <b>6</b>',E:'▲ <b>14</b>',B:'◇ ✦',C:'↳',R:'↳',D:'⊘'}[card.kind]||d.effect);return frontSkin()+'<span class="card-type" title="'+d.type+'" aria-label="'+d.type+'">'+d.type[0]+'</span><span class="card-name">'+d.short+'</span>'+faceIllustration(card)+'<span class="card-effect '+(card.kind==='B'?'condition':'')+'" aria-label="'+d.effect.replace(/<[^>]+>/g,'')+'">'+effect+'</span><span class="card-after" aria-label="'+d.after+'">'+after+'</span>';}

function enemyCards(){return state.round===1||state.round===10?[c('I','enemy-1'),c('I','enemy-2'),c('I','enemy-3'),c('I','enemy-4'),c('C','enemy-5')]:[c('E','enemy-1'),c('I','enemy-2'),c('I','enemy-3'),c('I','enemy-4'),c('R','enemy-5')];}
function cardHTML(card,index,zone){if(!card)return `<div class="card-wrap"><div class="empty-card" aria-label="${zone==='hand'?'手牌':'战斗行'}第${index+1}位空位">${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ'][index]}</div></div>`;const dark=zone==='enemy'&&isDark(card,index),done=zone!=='hand'&&state.column>index;const picked=picks.some(p=>p.zone===zone&&p.index===index);const label=dark?`敌方第${index+1}位 ${card.kind==='R'?'打断':'攻击'} ${['C','R'].includes(card.kind)?'延时':'即时'} 暗牌`: `${zone==='hand'?'手牌':zone==='enemy'?'敌方':'玩家'}第${index+1}位 ${definitions[card.kind].name}`;return `<div class="card-wrap ${picked?'picked':''} ${done?'done':''} ${state.mode==='settlement'&&state.column===index+1?'current':''}"><button class="card ${dark?'back':''}" data-zone="${zone}" data-index="${index}" data-focus="${zone}-${index}" aria-label="${label}，查看详情" type="button">${cardFace(card,{dark})}</button>${arranging&&zone!=='enemy'?`<button type="button" class="pick" data-pick-zone="${zone}" data-pick-index="${index}" aria-label="${picked?'取消选择':'选择'}${label}" aria-pressed="${picked}">${picked?'✓':'＋'}</button>`:''}</div>`;}
function chip(kind,value,max,name,symbol,sub=''){const layers=value===0?0:Math.min(5,Math.ceil(Math.log2(value+1))),crops={life:'124 92 530 505',armor:'732 92 530 505',spell:'1340 92 530 505'};return '<div class="chip-stat '+kind+'" title="'+name+(sub?' · '+sub:'')+'" aria-label="'+name+' '+value+(max?'，上限'+max:'')+(sub?'，'+sub:'')+'"><div class="chip-pile '+(layers?'':'zero')+'" aria-hidden="true">'+(layers?Array.from({length:layers},(_,i)=>'<i class="coin" style="--level:'+i+'">'+(i===layers-1?imageArt('06-chips-v01.png',crops[kind],1983,793,'asset-coin'):'')+'</i>').join(''):symbol)+'</div><div><div class="chip-value">'+value+(max?'<small> / '+max+'</small>':'')+'</div></div></div>';}

function renderArtifacts(){const a=[{name:'守护护符',art:'guard-artifact',batch:state.guard,kind:'G',future:'守护',d:1},{name:'施法护符',art:'spell-artifact',batch:state.batch,kind:state.mage,future:state.future,d:3}];$('artifacts').innerHTML=a.map((item,i)=>`<button type="button" class="artifact" data-artifact="${i}" data-focus="artifact-${i}" aria-label="查看${item.name}详情">${objectArt(i===0?'guardian':'caster','artifact-art')}<h3>${i===0?'守护':'施法'}</h3><p>${item.batch?`${definitions[item.kind].short} ${state.beat-item.batch[0]}/${item.d}`:'尚未开工'}</p><span class="progress" aria-hidden="true">${Array.from({length:item.d},(_,n)=>`<i class="${item.batch&&state.beat-item.batch[0]>n?'filled':''}"></i>`).join('')}</span>${i===1?`<p class="future-tag" title="下一批用途">→ ${item.future}</p>`:''}</button>`).join('')+['Ⅲ','Ⅳ'].map(n=>`<div class="artifact reserved" aria-label="法器预留位置${n}"><span class="roman" title="法器预留">${n}</span></div>`).join('');}
function render(){
 $('round').textContent=String(state.round).padStart(2,'0');$('phase').textContent=state.phase;
 $('beat').textContent=(['settlement','ended','fatigue','fatigueDone'].includes(state.mode)?`结算 ${state.column} / 5`:`生产 ${state.beat===0?0:((state.beat-1)%5)+1} / 5`)+` · ${state.beat}拍`;
 $('fatigue').textContent=state.round===10?(state.mode==='fatigue'?'本轮疲劳 · 双方 −5 生命':'疲劳 · 本轮已处理'):'疲劳 10轮起';
 $('enemy-cards').innerHTML=enemyCards().map((card,i)=>cardHTML(card,i,'enemy')).join('');
 $('player-cards').innerHTML=Array.from({length:5},(_,i)=>cardHTML(state.table[i],i,'table')).join('');
 $('hand-cards').innerHTML=Array.from({length:3},(_,i)=>cardHTML(state.hand[i],i,'hand')).join('');
 $('enemy-counters').innerHTML=chip('life',state.enemy,144,'生命','♥');
 $('player-counters').innerHTML=chip('life',state.hp,60,'生命','♥')+chip('armor',state.armor,0,'护甲','◇')+chip('spell',state.spell,10,'施法次数','✦',`锁定 0 · 可用 ${state.spell}`);
 $('hand-capacity').textContent=`${state.hand.length} / 3`;$('ap').textContent=state.ap;$('ap-dots').innerHTML=[0,1,2].map(i=>`<i class="${i<state.ap?'on':''}"></i>`).join('');renderArtifacts();
 const hasFuture=state.column===5&&state.round===2;
 $('enemy-note').innerHTML=hasFuture?`<button class="follow-up" data-follow-up type="button" aria-label="下一回合，溶解冲击，目标施法护符，第3回合可用，顺序1">⊘ 溶解冲击<small>→ 施法护符<br>第3轮 · 序1</small></button>`:state.mode==='fatigue'||state.mode==='fatigueDone'?`<button class="follow-up" data-next-explosion type="button" aria-label="下一回合，爆裂试剂，伤害14，目标玩家，第11回合可用，顺序1">▲ 爆裂试剂<small>14 → 玩家<br>第11轮 · 序1</small></button>`:'';
 $('arrange').disabled=!canEdit();$('arrange').classList.toggle('active',arranging);$('arrange').textContent=arranging?'退出整理':'整理';$('apply').hidden=!arranging;$('step').disabled=['ready','production','ended','fatigueDone'].includes(state.mode);
 const valid=picks.length===2&&picks.some(p=>p.zone==='table')||picks.length===1&&picks[0].zone==='hand'&&state.table.length<5;
 $('apply').disabled=!(valid&&state.ap>0);$('apply').textContent=picks.length===1&&picks[0].zone==='hand'&&state.table.length<5?'铺入最左空位 · 1点':'确认整理 · 1点';
 const labels={arrange:'确认结算',ready:'继续',production:'继续',settlement:playing?'暂停':'继续',ended:'重看',fatigue:'结算疲劳',fatigueDone:'重看'};$('primary').textContent=labels[state.mode];
 $('context').textContent=arranging?(state.ap===0?'整理点已用尽':picks.length?`已选 ${picks.length} 张 · 确认消耗 1 点`:'点＋选牌'):state.mode==='settlement'?`第 ${state.column} 列 · ${playing?'结算中':'暂停'}`:'';

}
function load(name){stop();scenario=name;$('scene').value=name;state=structuredClone(fixtures[name]);arranging=false;picks=[];render();}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('visible');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2800);}
function stop(){clearTimeout(playTimer);playing=false;}
function openDialog(html){stop();lastFocus=document.activeElement?.dataset.focus;render();$('dialog-content').innerHTML=html;$('detail').showModal();}
function closeDialog(){if($('detail').open)$('detail').close();}
$('detail').addEventListener('close',()=>{if(lastFocus)document.querySelector(`[data-focus="${lastFocus}"]`)?.focus();lastFocus=null;});
document.querySelector('.dialog-close').addEventListener('click',closeDialog);
function detailCard(card,zone,index){const dark=zone==='enemy'&&isDark(card,index),d=definitions[card.kind];const title=dark?'尚未公开的行动':d.name;
 let body=dark?`<p>本列开始结算时，才会公开完整效果与目标。</p><dl><dt>当前可知</dt><dd>${card.kind==='R'?'⊘ 打断':'▲ 攻击'} · ${['C','R'].includes(card.kind)?'延时':'即时'}<br>本轮第${index+1}位</dd></dl><small>查看详情不会翻开暗牌。</small>`:`<p>${d.body}</p>${card.kind==='B'?'<div class="branch"><strong>可消费施法次数 ≥ 5</strong>消耗5次，造成18点普通伤害。</div><div class="branch"><strong>可消费施法次数 &lt; 5</strong>不消耗，回退为6点普通伤害。</div><p>攻击成功且战斗未终局，随后增加1次施法次数。无合法目标时不支付、不攻击、不记次。</p>':''}${d.source?`<dl><dt>制造来源</dt><dd>${d.source}<br>${d.cost}</dd></dl><small>制造与入区不触发卡效；成功后的施法次数只在生效后获得。致死后不补后续记次。</small>`:`<small>${card.kind==='D'?'已公开 · 第3回合可用 · 生成序1 · 锁定施法护符':card.kind==='E'?'已公开 · 固定目标：玩家':'本列公开的原生行动'}</small>`}`;
 openDialog(`<div class="dialog-kicker">${dark?'未知行动':'卡牌详情'} / CARD</div><h2 class="dialog-title" id="dialog-title">${title}</h2><div class="detail-layout"><div class="detail-preview"><div class="card ${dark?'back':''}">${cardFace(card,{dark,detail:true})}</div></div><div class="detail-copy">${body}</div></div><div class="dialog-foot"><span>关闭后仍保持暂停</span><button class="control" data-close type="button">返回牌桌 <span class="key">Esc</span></button></div>`);
}
function detailArtifact(index){const mage=index===1,batch=mage?state.batch:state.guard,kind=mage?state.mage:'G',d=mage?3:1;openDialog(`<div class="dialog-kicker">法器详情 / ARTIFACT</div><h2 class="dialog-title" id="dialog-title">${mage?'施法护符':'守护护符'}</h2><div class="detail-layout">${objectArt(mage?'caster':'guardian','artifact-preview')}<div class="detail-copy"><dl><dt>装配</dt><dd>${mage?'核心 · 打击<br>辅槽 · 空':'核心 · 庇护<br>辅槽 · 迅速'}</dd><dt>当前批次 · 已承诺</dt><dd>${batch?`${definitions[kind].name}<br>第${batch[0]}拍开工 → 第${batch[1]}拍完工<br>进度 ${state.beat-batch[0]} / ${d} 生产拍 · 零材料`:'尚未开工 · 零材料'}</dd><dt>未来用途 · 下一批开工时采用</dt><dd>${mage?`<label for="future-select">用途</label><select class="future-select" id="future-select" ${canEdit()?'':'disabled'}><option ${state.future==='普通积累'?'selected':''}>普通积累</option><option ${state.future==='集中兑现'?'selected':''}>集中兑现</option></select>`:'守护 · 固定用途'}</dd></dl><small>${canEdit()?'修改未来用途免费，不改变当前批次或已有成品。':'结算已启动，未来用途只读。'}<br>此处仅展示设置路径，后续场景仍取固定示意输入。</small></div></div><div class="dialog-foot"><span>关闭后仍保持暂停</span><button class="control" data-close type="button">返回牌桌 <span class="key">Esc</span></button></div>`);}
function choose(zone,index){if(!arranging||!canEdit())return;const found=picks.findIndex(p=>p.zone===zone&&p.index===index);if(found>=0)picks.splice(found,1);else if(picks.length<2)picks.push({zone,index});else picks=[{zone,index}];render();}
function applyArrangement(){if(!canEdit()||state.ap<=0)return toast('整理点不足，牌位保持不变');if(picks.length===1&&picks[0].zone==='hand'&&state.table.length<5){state.table.push(state.hand.splice(picks[0].index,1)[0]);}else if(picks.length===2&&picks.some(p=>p.zone==='table')){const [a,b]=picks;[state[a.zone][a.index],state[b.zone][b.index]]=[state[b.zone][b.index],state[a.zone][a.index]];}else return toast('请选择两张桌牌、桌手各一张，或将手牌铺入最左空位');state.ap--;picks=[];render();toast('整理完成 · 消耗1点');}
function requestSettlement(single=false){const canonical=state.table.map(x=>x.id).join(',')==='G6,G8,G5,G7,B9'&&state.future==='集中兑现';openDialog(`<div class="dialog-kicker">最终确认 / SETTLEMENT</div><h2 class="dialog-title" id="dialog-title">确认这一轮的安排</h2><div class="dialog-body"><p>开始后，按第1至第5列结算。期间可以暂停和查看，不能再整理或修改用途。</p><p>${canonical?'当前排列与EX-004示范路线一致，将展示对应的逐列结算快照。':'本HTML只提供EX-004固定路线的结算展示。继续将载入示范排列与点数，当前的局部调整不参与战斗计算。'}</p></div><div class="dialog-actions"><button class="control" data-close type="button">继续整理</button><button class="control primary" data-start="${single?'step':'play'}" type="button">${canonical?'确认并结算':'载入示范并结算'}</button></div>`);}
function beginSettlement(single){closeDialog();state=structuredClone(fixtures.ended);Object.assign(state,settlement[0],{mode:'settlement',phase:'逐列结算',reveal:0,column:0});arranging=false;picks=[];if(single)step();else{render();play();}}
function step(){if(state.mode==='arrange')return requestSettlement(true);if(state.mode==='fatigue')return showFatigue();if(state.mode!=='settlement'||state.column>=5)return;state.column++;state.reveal=state.column;Object.assign(state,settlement[state.column]);if(state.column===5){stop();state.mode='ended';state.phase='本轮已结清';}render();}
function play(){if(playing){stop();render();return;}playing=true;render();function tick(){if(!playing)return;step();if(playing)playTimer=setTimeout(tick,1500);}playTimer=setTimeout(tick,800);}
function showFatigue(){stop();state.hp=51;state.enemy=79;state.mode='fatigueDone';state.phase='疲劳已结清';render();toast('固定轮尾结果：双方生命 −5，护甲不变');}
function fixtureTransition(name){openDialog(`<div class="dialog-kicker">状态示意 / PREVIEW</div><h2 class="dialog-title" id="dialog-title">查看下一张状态示意</h2><div class="dialog-body">此HTML用于审阅页面结构。将切换到EX-004的${name==='production'?'第二轮第6拍暂停':'第二轮最终整理'}固定输入；当前局部调整会重置，不进行完整战斗计算。</div><div class="dialog-actions"><button class="control" data-close type="button">留在当前状态</button><button class="control primary" data-load="${name}" type="button">切换示意</button></div>`);}
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target||target.disabled)return;if(target.matches('[data-zone]')){const zone=target.dataset.zone,index=Number(target.dataset.index),card=zone==='enemy'?enemyCards()[index]:state[zone][index];detailCard(card,zone,index);}else if(target.matches('[data-artifact]'))detailArtifact(Number(target.dataset.artifact));else if(target.matches('[data-pick-zone]'))choose(target.dataset.pickZone,Number(target.dataset.pickIndex));else if(target.matches('[data-close]'))closeDialog();else if(target.matches('[data-follow-up]'))detailCard(c('D','next'),'future',0);else if(target.matches('[data-next-explosion]'))detailCard(c('E','next'),'future',0);else if(target.matches('[data-start]'))beginSettlement(target.dataset.start==='step');else if(target.matches('[data-load]')){closeDialog();load(target.dataset.load);}});
document.addEventListener('change',event=>{if(event.target.id==='future-select'&&canEdit()){state.future=event.target.value;render();toast('未来用途已更新；当前批次保持不变');}});
$('scene').addEventListener('change',event=>{load(event.target.value);document.querySelector('.preview-tools').open=false;});$('reset').addEventListener('click',()=>{load(scenario);document.querySelector('.preview-tools').open=false;toast('已恢复当前示意的固定输入');});$('arrange').addEventListener('click',()=>{arranging=!arranging;picks=[];render();});$('apply').addEventListener('click',applyArrangement);$('step').addEventListener('click',()=>{stop();step();});
$('primary').addEventListener('click',()=>{switch(state.mode){case'arrange':requestSettlement();break;case'settlement':play();break;case'ready':fixtureTransition('production');break;case'production':fixtureTransition('arrange');break;case'fatigue':showFatigue();break;default:load('arrange');}});
window.addEventListener('blur',()=>{if(playing){stop();render();}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stop();render();}});
$('table-props').innerHTML=imageArt('07-lamp-v01.png','190 115 1160 800',1536,1024,'prop-lamp')+imageArt('08-vial-v02.png','50 50 980 1300',1086,1448,'prop-vial')+imageArt('09-notes-v01.png','275 50 1010 930',1536,1024,'prop-notes');
$('decor-toggle').addEventListener('change',event=>document.querySelector('.app').classList.toggle('hide-props',!event.target.checked));
load('arrange');
</script>
</body></html>
