<header><h1>言咒 · 桌面表现 v01</h1><small>阶段2 / 自制结构与动作示意　参考：Demoncards　不是游戏运行证据</small><button class="mode" id="reduced">减动效：关</button></header>
<nav aria-label="设计审查情境" id="scenarios"></nav>
<main><div id="viewport"><div id="scene"></div></div><div class="statusline"><span id="caption"></span><span id="state"></span></div><div class="notes"><p><b>制作重点</b><br>酒红吸光织物、宽木桌沿、薄纸牌与细线窄槽。必要文字绑定宿主；近观说明用纸签分组，操作从物件进入。</p><p><b>不可改变的边界</b><br>完工原位显牌；使用原位卡亮与目标同起。暂停／单步／载入静态归位。移动只作公开展示，既有结果、目标、消费锁与隐藏信息不变。</p></div></main>

function control(x,icon,label,kind){const el=add('button','physical control',x,771,icon);el.dataset.kind=kind;el.setAttribute('aria-label',label);el.addEventListener('pointerenter',()=>showTip(el,label));el.addEventListener('pointerleave',hideTip);el.addEventListener('focus',()=>showTip(el,label));el.addEventListener('blur',hideTip);el.addEventListener('click',()=>{if(kind==='play'){if(saveFailed){openDetail('error',el);return}paused=!paused;if(paused)cancelEffects();$('#state').textContent=paused?'示意已暂停':'示意播放；无后端推进';el.textContent=paused?'▶':'Ⅱ'}else if(kind==='step'){if(saveFailed){openDetail('error',el);return}setCase('cancel')}else if(kind==='home'){setCase('table')}else if(kind==='left'||kind==='right'){paused=true;setCase(kind==='right'?'move':'table');paused=true;cancelEffects();$('#state').textContent='回看：静态显示，不推进'}else{openDetail(kind,el)}});return el}

 for(let i=0;i<cols;i++){const b=windowStart+i,x=cx(b);add('div','slot enemy',x-48,231);add('div','slot',x-56.5,464);add('div','tick'+(b===f.beat?' current':''),x-40,403,b+'拍')}
