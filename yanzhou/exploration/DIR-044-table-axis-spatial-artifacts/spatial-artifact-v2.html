<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>言咒·空间法器约束 真实数据版</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:16px;background:#f6f4ee;color:#2b2a27;font:14px/1.5 'Microsoft YaHei',sans-serif}h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:14px 0 4px}.sub{color:#6b665a;margin-bottom:12px}.wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.panel{background:#fff;border:1px solid #cfc9bb;border-radius:8px;padding:12px;min-width:0;flex:1 1 340px}.tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}button{border:1px solid #cfc9bb;background:#faf9f5;border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit}button.on{background:#2b2a27;color:#fff}#grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;width:100%;max-width:460px}.cell{aspect-ratio:1/1;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;line-height:1.1;min-width:0}.cell small{font-size:11px;opacity:.85}.warn{color:#b3402a}.ok{color:#2e7d4f}table{border-collapse:collapse;width:100%;margin:6px 0}th,td{border-bottom:1px solid #e4e0d4;padding:3px 5px;text-align:left;font-size:12px}.scroll{overflow-x:auto}.legend{font-size:12px;color:#6b665a;margin-top:6px;max-width:460px}</style></head><body><h1>空间法器约束 · 真实数据版</h1><div class='sub'>8×5 背包。八法器占形与35配方的D取自内容库。规则：到炉心的格距分圈，整件落入某圈才享受该圈下限（1+圈号），跨圈取外侧圈，实际D=max(配方D, 圈下限)。炉心必选。规则数值均为示意。</div><div class='wrap'><div class='panel'><div id='tools' class='tools'></div><div id='grid'></div><div id='msg' class='warn'></div><div class='legend'>格内数字=该格所在圈（到最近炉心的格距，0圈=与炉心共边）。底色：橙0圈、黄1圈、绿2圈、蓝3圈及以上。红框=拖慢该法器的那几格。选好物件后点击格子放置，点击格为占形包围盒左上角，可先旋转。</div></div><div class='panel'><div id='sum'></div><div class='scroll' id='tbl'></div><h2>手算核对（空背包穷举最佳摆法）</h2><div class='scroll' id='chk'></div></div></div><script>const W=8,H=5;const ART={cru:{n:'初相坩埚',s:'坩埚',col:'#8d6e63',c:[[0,0],[1,0],[0,1],[1,1]],r:[['硫',2],['汞',2],['盐',2]]},mor:{n:'刻纹研钵',s:'研钵',col:'#6d8a96',c:[[0,0],[1,0]],r:[['精铁砂砾',3],['日辉晶粉',3],['夜影尘粉',2],['金刚晶砂',4]]},ext:{n:'盘管萃炼器',s:'萃炼',col:'#3f8f7a',c:[[0,0],[1,0],[0,1],[1,1],[0,2],[1,2]],r:[['滚烫蒸汽',2],['轻盈雾团',2],['草药汁液',2],['水银溶剂',3],['草本灵液',3],['再生精华液',5],['清醒凝露',3],['蚀解溶液',4]]},pha:{n:'封相炼炉',s:'炼炉',col:'#c0622f',c:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],r:[['硫磺火种',3],['辉光灵火',4],['盐晶核',3],['幽影封盐',3],['浮空晶石',3],['封魔结晶',5],['日冕之火',4],['爆鸣火核',4],['幽冥磷火',3]]},ret:{n:'白瓷曲颈瓶',s:'曲颈',col:'#7b7fd1',c:[[0,0],[0,1],[0,2],[1,2]],r:[['生命灵药',2],['铁肤药水',2],['醒神药水',3]]},mol:{n:'黑铁铸模',s:'铸模',col:'#4a4a55',c:[[0,0],[1,0],[2,0]],r:[['水银飞弹',3],['炼金爆弹',4],['结晶护符',4]]},lam:{n:'黄铜显咒灯',s:'显咒',col:'#b8902c',c:[[0,0],[0,1],[0,2]],r:[['引燃术',3],['日轮术',4],['离解术',3]]},ath:{n:'红玻璃合一炉',s:'合一',col:'#a8324a',c:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]],r:[['贤者之石',6],['万灵药',5]]}};const FUR={f1:{n:'小炉 1×1',c:[[0,0]]},f2:{n:'长炉 1×2',c:[[0,0],[0,1]]}};const $=id=>document.getElementById(id);let P=[],tool='lam',rot=0,nid=1;const CL=['#fcd9bd','#fbf1c7','#dcefd5','#d6e6f7'];const def=k=>ART[k]||FUR[k];function norm(cs){const mx=Math.min(...cs.map(c=>c[0])),my=Math.min(...cs.map(c=>c[1]));return cs.map(c=>[c[0]-mx,c[1]-my])}function rotc(cs){return norm(cs.map(c=>[-c[1],c[0]]))}function rotN(cs,n){let c=norm(cs);for(let i=0;i<n;i++)c=rotc(c);return c}function variants(cs){const r=[],seen={};let c=norm(cs);for(let i=0;i<4;i++){const k=c.map(q=>q.join(',')).sort().join(';');if(!seen[k]){seen[k]=1;r.push(c)}c=rotc(c)}return r}function occ(){const m={};P.forEach(p=>p.cells.forEach(c=>{m[c[0]+','+c[1]]=p}));return m}function ringOf(fc,x,y){let b=99;fc.forEach(c=>{b=Math.min(b,Math.max(0,Math.abs(c[0]-x)+Math.abs(c[1]-y)-1))});return b}function ringMap(){const fc=[];P.forEach(p=>{if(FUR[p.t])p.cells.forEach(c=>fc.push(c))});if(!fc.length)return null;const m={};for(let y=0;y<H;y++)for(let x=0;x<W;x++)m[x+','+y]=ringOf(fc,x,y);return m}function calc(rm){const R={};P.forEach(p=>{const d=ART[p.t];if(!d)return;const base=d.r[p.rec][1];if(!rm){R[p.id]={base:base,D:base,dm:null,fl:null,bind:false};return}let dm=0;p.cells.forEach(c=>{dm=Math.max(dm,rm[c[0]+','+c[1]])});const fl=1+dm;R[p.id]={base:base,D:Math.max(base,fl),dm:dm,fl:fl,bind:fl>base}});return R}function draw(){const rm=ringMap(),R=calc(rm),o=occ();let t='';Object.keys(FUR).concat(Object.keys(ART)).forEach(k=>{t+=`<button data-k='${k}' class='${tool===k?'on':''}'>${def(k).n}</button>`});t+=`<button data-k='erase' class='${tool==='erase'?'on':''}'>擦除</button><button data-k='rot'>旋转：${rot*90}°</button><button data-k='pre'>载入首战布局</button><button data-k='clr'>清空</button>`;$('tools').innerHTML=t;let g='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const key=x+','+y,p=o[key],r=rm?rm[key]:null;if(p){const q=R[p.id];const lim=q&&q.bind&&r===q.dm;const bg=FUR[p.t]?'#e8833a':ART[p.t].col;const first=p.cells[0][0]===x&&p.cells[0][1]===y;const lb=FUR[p.t]?'炉':(first?ART[p.t].s:'');g+=`<div class='cell' data-x='${x}' data-y='${y}' style='background:${bg};color:#fff${lim?';outline:3px solid #d9534f;outline-offset:-3px':''}'>${lb}<small>${r===null?'':r}</small></div>`}else{g+=`<div class='cell' data-x='${x}' data-y='${y}' style='background:${r===null?'#eceae3':CL[Math.min(r,3)]};color:#8a8472;border:1px dashed #cfc9bb'><small>${r===null?'·':r}</small></div>`}}$('grid').innerHTML=g;let used=0,nF=0,nA=0,nb=0;P.forEach(p=>{used+=p.cells.length;if(FUR[p.t])nF++;else{nA++;if(R[p.id].bind)nb++}});let s=`<div>占格 <b>${used}/${W*H}</b>（仅法器与炉心，材料占格不在本原型内）</div>`;if(!nF)s+=`<div class='warn'>未放置炉心：炉心必选，当前不可开战。</div>`;else if(!nA)s+=`<div class='warn'>没有法器：至少需要一台。</div>`;else s+=`<div class='${nb?'warn':'ok'}'>${nb?nb+' 台法器的D被空间下限抬高':'所有法器的D均不受空间下限影响'}</div>`;$('sum').innerHTML=s;let h=`<table><tr><th>法器</th><th>配方</th><th>基础D</th><th>最远圈</th><th>下限</th><th>实际D</th><th>状态</th></tr>`;P.filter(p=>ART[p.t]).forEach(p=>{const d=ART[p.t],r=R[p.id];const opts=d.r.map((q,i)=>`<option value='${i}'${i===p.rec?' selected':''}>${q[0]} D${q[1]}</option>`).join('');h+=`<tr><td>${d.n}#${p.id}</td><td><select data-id='${p.id}'>${opts}</select></td><td>${r.base}</td><td>${r.dm===null?'—':r.dm}</td><td>${r.fl===null?'—':r.fl}</td><td><b>${r.D}</b></td><td class='${r.bind?'warn':'ok'}'>${r.dm===null?'无炉心':(r.bind?'被第'+r.dm+'圈拖慢 +'+(r.fl-r.base):'达标')}</td></tr>`});h+='</table>';$('tbl').innerHTML=h}function best(k,fk){const av=variants(ART[k].c),fv=variants(FUR[fk].c);let b=99;for(const a of av)for(let ax=0;ax<W;ax++)for(let ay=0;ay<H;ay++){const ac=a.map(c=>[c[0]+ax,c[1]+ay]);if(ac.some(c=>c[0]>=W||c[1]>=H))continue;const s=new Set(ac.map(c=>c.join(',')));for(const f of fv)for(let fx=0;fx<W;fx++)for(let fy=0;fy<H;fy++){const fc=f.map(c=>[c[0]+fx,c[1]+fy]);if(fc.some(c=>c[0]>=W||c[1]>=H||s.has(c.join(','))))continue;let dm=0;ac.forEach(c=>{dm=Math.max(dm,ringOf(fc,c[0],c[1]))});if(dm<b)b=dm}}return b}function check(){let h='<table><tr><th>法器</th><th>格数</th><th>小炉最佳下限</th><th>长炉最佳下限</th><th>长炉也到不了的配方</th></tr>';Object.keys(ART).forEach(k=>{const d=ART[k],a=best(k,'f1'),b=best(k,'f2');const bad=d.r.filter(q=>q[1]<1+b).map(q=>q[0]+' D'+q[1]).join('、')||'无';h+=`<tr><td>${d.n}</td><td>${d.c.length}</td><td>${1+a}</td><td>${1+b}</td><td>${bad}</td></tr>`});$('chk').innerHTML=h+'</table>'}function pre(){P=[];nid=1;const add=(t,cs,rec)=>P.push({id:nid++,t:t,cells:cs,rec:rec});add('lam',[[0,0],[0,1],[0,2]],0);add('ret',[[1,2],[1,3],[1,4],[2,4]],1);add('ret',[[4,2],[4,3],[4,4],[5,4]],0);add('ext',[[6,0],[7,0],[6,1],[7,1],[6,2],[7,2]],4);add('f2',[[2,2],[3,2]],0)}$('tools').onclick=e=>{const k=e.target.dataset.k;if(!k)return;$('msg').textContent='';if(k==='rot')rot=(rot+1)%4;else if(k==='pre')pre();else if(k==='clr')P=[];else tool=k;draw()};$('tbl').onchange=e=>{const id=+e.target.dataset.id;if(!id)return;const p=P.find(q=>q.id===id);p.rec=+e.target.value;draw()};$('grid').onclick=e=>{const c=e.target.closest('.cell');if(!c)return;const x=+c.dataset.x,y=+c.dataset.y,o=occ(),p=o[x+','+y];$('msg').textContent='';if(tool==='erase'){if(p)P=P.filter(q=>q!==p);draw();return}if(p){$('msg').textContent='该格已被占用（用擦除移除）';return}const cs=rotN(def(tool).c,rot).map(q=>[q[0]+x,q[1]+y]);if(cs.some(q=>q[0]>=W||q[1]>=H)){$('msg').textContent='越界：以点击格为左上角放不下';return}if(cs.some(q=>o[q.join(',')])){$('msg').textContent='与已有物件重叠';return}P.push({id:nid++,t:tool,cells:cs,rec:0});draw()};pre();draw();check();</script></body></html>
