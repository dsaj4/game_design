<div id="yz-field-patrol">
  <div class="viz-controls">
    <label class="form-label">范围方式
      <select class="form-select" id="yz-field-mode">
        <option value="patrol">候选：F2 → F3 → F4 巡行</option>
        <option value="fixed">基线：固定在 F2</option>
      </select>
    </label>
    <label class="form-label">名义释放 <output id="yz-field-step-label">第3次 · 第14刻</output>
      <input class="form-range" id="yz-field-step" type="range" min="1" max="3" step="1" value="3" aria-label="查看第几次名义释放">
    </label>
  </div>
  <div class="text-small yz-field-caption">后排 B</div>
  <div class="yz-field-board" role="img" aria-label="两排五格战场，甲在F2，乙在B4。候选范围覆盖以锚点为中心的两排三列。">
    <div class="yz-field-cell" data-col="1" data-cell="B1">B1</div>
    <div class="yz-field-cell" data-col="2" data-cell="B2">B2</div>
    <div class="yz-field-cell yz-field-covered" data-col="3" data-cell="B3">B3</div>
    <div class="yz-field-cell yz-field-covered yz-field-target" data-col="4" data-cell="B4">B4·乙</div>
    <div class="yz-field-cell yz-field-covered" data-col="5" data-cell="B5">B5</div>
    <div class="yz-field-cell" data-col="1" data-cell="F1">F1</div>
    <div class="yz-field-cell" data-col="2" data-cell="F2">F2·甲</div>
    <div class="yz-field-cell yz-field-covered" data-col="3" data-cell="F3">F3</div>
    <div class="yz-field-cell yz-field-covered yz-field-anchor" data-col="4" data-cell="F4">F4</div>
    <div class="yz-field-cell yz-field-covered" data-col="5" data-cell="F5">F5</div>
  </div>
  <div class="text-small yz-field-caption">前排 F · 玩家在棋盘外</div>
  <div class="viz-row text-small yz-field-key">
    <span><span class="yz-field-swatch"></span>覆盖范围</span>
    <span>◎ 范围锚点</span>
    <span>下划线：首个合法候选</span>
  </div>
  <div id="yz-field-result" aria-live="polite">第14刻：锚点F4，首个候选为乙。</div>
  <div class="text-small text-muted">名义示意 · 两敌均存活、甲先于乙 · 未计算伤害、取消或胜负</div>
</div>
<style>
  #yz-field-patrol .yz-field-board { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:8px 0; }
  #yz-field-patrol .yz-field-cell { min-height:64px; display:flex; align-items:center; justify-content:center; position:relative; border:1px solid var(--border); color:var(--foreground); }
  #yz-field-patrol .yz-field-covered { background:color-mix(in srgb,var(--viz-series-1) 20%,transparent); }
  #yz-field-patrol .yz-field-anchor::before { content:'◎'; position:absolute; inset-inline-start:4px; inset-block-start:2px; }
  #yz-field-patrol .yz-field-target { text-decoration:underline; text-underline-offset:5px; }
  #yz-field-patrol .yz-field-caption { margin-top:10px; }
  #yz-field-patrol .yz-field-key { margin:14px 0 10px; }
  #yz-field-patrol .yz-field-swatch { display:inline-block; width:12px; height:12px; background:color-mix(in srgb,var(--viz-series-1) 35%,transparent); margin-inline-end:4px; }
</style>
<script>
(() => {
  const root = document.getElementById('yz-field-patrol');
  const mode = root.querySelector('#yz-field-mode');
  const step = root.querySelector('#yz-field-step');
  const label = root.querySelector('#yz-field-step-label');
  const result = root.querySelector('#yz-field-result');
  const cells = root.querySelectorAll('[data-cell]');
  const times = [6, 10, 14];
  function update() {
    const index = Number(step.value) - 1;
    const anchor = mode.value === 'fixed' ? 2 : index + 2;
    const target = Math.abs(2 - anchor) <= 1 ? 'F2' : 'B4';
    cells.forEach(cell => {
      cell.classList.toggle('yz-field-covered', Math.abs(Number(cell.dataset.col) - anchor) <= 1);
      cell.classList.toggle('yz-field-anchor', cell.dataset.cell === 'F' + anchor);
      cell.classList.toggle('yz-field-target', cell.dataset.cell === target);
    });
    label.textContent = '第' + (index + 1) + '次 · 第' + times[index] + '刻';
    result.textContent = '第' + times[index] + '刻：锚点F' + anchor + '，首个候选为' + (target === 'F2' ? '甲' : '乙') + '。';
  }
  mode.addEventListener('change', update);
  step.addEventListener('input', update);
  update();
})();
</script>
