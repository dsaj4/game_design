function sourceLinks(keys){return '<div class="source-links">'+keys.map(k=>{const s=data.sources[k];const href=s.href||(s.path?'file:///'+s.path:'');return '<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(s.label)+' ↗</a>'}).join('')+'</div>'}
function artMarkup(x,index=0,detail=false){const a=x.art[index];return a?'<img '+(detail?'class="hero-image"':'loading="lazy"')+' src="'+esc(a.path)+'" alt="'+esc(x.name+' · '+a.label)+'" data-fallback-kind="'+esc(x.kind)+'">':emblem(x.kind)+(detail?'<p class="placeholder-caption">尚无绑定图稿 · 类型符号</p>':'<span class="no-art-label">待绘制</span>')}
function setFallbacks(){document.querySelectorAll('img[data-fallback-kind]').forEach(img=>{img.addEventListener('error',()=>{const wrapper=document.createElement('div');wrapper.innerHTML=emblem(img.dataset.fallbackKind)+'<p class="placeholder-caption">图稿在原件位置暂不可用</p>';img.replaceWith(wrapper)},{once:true})})}
function matches(x){return(state.kind==='all'||x.kind===state.kind)&&(state.collection==='all'||x.collection===state.collection)&&(state.status==='all'||x.status===state.status)&&(!state.art||x.art.length)&&(!state.query||searchText.get(x.id).includes(state.query.toLowerCase()))}
function categories(){const list=[['all','全部物件'],...Object.entries(kindNames).filter(([k])=>data.items.some(x=>x.kind===k))];$('categories').innerHTML=list.map(([k,n])=>'<button class="nav-item" data-kind="'+k+'" aria-pressed="'+(state.kind===k)+'"><span>'+n+'</span><span>'+data.items.filter(x=>k==='all'||x.kind===k).length+'</span></button>').join('')}
function render(){categories();$('collection').value=state.collection;$('status').value=state.status;$('search').value=state.query;$('art-only').checked=state.art;
 document.querySelectorAll('[data-view]').forEach(b=>{const selected=b.dataset.view===state.view;b.setAttribute('aria-selected',selected);b.tabIndex=selected?0:-1});$('results').setAttribute('aria-labelledby','tab-'+state.view);
 $('view-title').textContent=state.view==='recipes'?'每一份投入，都有去向':state.kind==='all'?'从一份材料，到一件成品':kindNames[state.kind];
 if(state.view==='objects'){
  const filtered=data.items.filter(matches);$('result-count').textContent='显示 '+filtered.length+' / '+data.items.length+' 件设计';$('results').className='grid';$('results').innerHTML=filtered.map(x=>'<button class="object" data-object="'+esc(x.id)+'" aria-label="查看'+esc(x.name)+'详情"><div class="picture">'+artMarkup(x)+'<span class="item-number">'+esc(x.id)+'</span></div><div class="text"><div class="meta"><span>'+kindNames[x.kind]+'</span><span>'+collections[x.collection]+'</span></div><h3>'+esc(x.name)+'</h3><p class="brief">'+esc(x.summary)+'</p>'+badge(x)+'</div></button>').join('');
 }else{
  const filtered=data.recipes.filter(r=>{const output=by.get(r.output);return(state.kind==='all'||output.kind===state.kind)&&(state.collection==='all'||state.collection==='alchemy')&&(state.status==='all'||state.status==='partial')&&(!state.art||output.art.length)&&(!state.query||JSON.stringify([r.id,output.name,by.get(r.artifact).name,r.process,r.reason,...r.inputs.map(i=>by.get(i.id).name)]).toLowerCase().includes(state.query.toLowerCase()))});$('result-count').textContent='显示 '+filtered.length+' / '+data.recipes.length+' 条配方 · 连接已确认，规格候选';$('results').className='recipe-list';$('results').innerHTML=filtered.map(r=>'<button class="recipe-row" data-recipe="'+r.id+'"><div><strong>'+esc(by.get(r.output).name)+'</strong><small>'+esc(r.process)+' · D'+r.duration+' · 产出'+r.quantity+'份</small></div><div class="recipe-inputs">'+r.inputs.map(i=>esc(by.get(i.id).name)+' × '+i.quantity).join(' ＋ ')+'　→</div><div class="recipe-machine">'+esc(by.get(r.artifact).name)+'<br>查看投入职责与装载 ↗</div></button>').join('');
 }
 if(!$('results').children.length)$('results').innerHTML='<div class="empty"><p>没有符合条件的设计。</p><button class="text-btn" data-reset>清除筛选，查看全部</button></div>';setFallbacks();
}
function grid(shape,placements=[]){if(!shape||!shape.body.length)return '<p class="geometry-note">占形尚未确定</p>';const all=shape.body.concat(shape.feed),xs=all.map(c=>c[0]),ys=all.map(c=>c[1]),minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xs),maxY=Math.max(...ys),body=new Set(shape.body.map(c=>c.join(','))),feed=new Set(shape.feed.map(c=>c.join(','))),loaded=new Map();placements.forEach((p,n)=>p.cells.forEach(c=>loaded.set(c.join(','),[n+1,by.get('alchemy.'+p.id)?.name||p.id])));let h='<div class="foot-grid" role="img" aria-label="'+esc(shape.name||'实际格集合')+'，本体'+shape.body.length+'格，供料'+shape.feed.length+'格" style="--cols:'+(maxX-minX+1)+'">';for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){const k=x+','+y,v=loaded.get(k);h+='<span class="cell '+(body.has(k)?'body':v?'loaded':feed.has(k)?'feed':'')+'"'+(v?' aria-label="'+esc(v[1])+'"':'')+'>'+(v?'<span style="display:block;text-align:center;color:#fff;font-size:12px">'+v[0]+'</span>':'')+'</span>'}return h+'</div><div class="legend"><span><i></i>本体</span>'+(shape.feed.length?'<span><i class="feed"></i>供料</span>':'')+(placements.length?'<span><i class="loaded"></i>投入</span>':'')+'</div>'}
function openObject(id,fromHash=false){const x=by.get(id);if(!x)return;activeId=id;if(!$('detail').open)returnFocus=document.activeElement;$('detail-id').textContent=x.id+' / '+collections[x.collection];const incoming=data.recipes.filter(r=>r.output===id),outgoing=data.recipes.filter(r=>r.inputs.some(i=>i.id===id));
 $('detail-content').innerHTML='<div class="detail-grid"><div class="detail-art"><div id="art-hero">'+artMarkup(x,0,true)+'</div>'+(x.art.length>1?'<div class="art-choices">'+x.art.map((a,i)=>'<button class="art-choice" data-art="'+i+'" aria-pressed="'+(i===0)+'">'+esc(a.label)+'</button>').join('')+'</div>':'')+'<h3>空间形状</h3>'+grid(x.shape)+(x.shape?'<p class="geometry-note">'+esc(x.shape.name)+' · 候选几何<br>'+esc(x.shape.domain||'本体与供料分别计入部署')+'</p>':'')+(x.shape?.port?'<p class="geometry-note">接口 '+esc(JSON.stringify(x.shape.port))+'</p>':'')+'</div><div class="detail-body"><div class="eyebrow">'+kindNames[x.kind]+'</div><h2 id="detail-title">'+esc(x.name)+'</h2>'+badge(x)+'<p>'+esc(x.summary)+'</p>'+(x.description?'<p>'+esc(x.description)+'</p>':'')+'<p class="scope">'+esc(x.scope)+'</p>'+(x.facets?'<div class="small-note">'+Object.entries(x.facets).map(([k,v])=>esc(k)+'：'+esc(v)).join(' · ')+'</div>':'')+'<h3>具体设计</h3><dl class="definition">'+Object.entries(x.fields).map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl>'+(incoming.length?'<h3>如何制取</h3>'+incoming.map(r=>'<button class="chip" data-recipe="'+r.id+'">'+esc(r.process)+'配方 · 查看装载</button>').join(''):'')+(outgoing.length?'<h3>作为投入，还能炼成</h3>'+outgoing.map(r=>chip(r.output)).join(''):'')+(x.related.length?'<h3>关联物件</h3>'+x.related.map(i=>chip(i)).join(''):'')+(x.budgets?'<h3>R08部署下界</h3><dl class="definition">'+x.budgets.map((b,i)=>'<dt>'+['普通料起步','已持二级及以下前料','已持全部直接投入'][i]+'</dt><dd>'+b.current.machines+'台 · '+b.current.area+'格 · '+b.current.cores+'个真实核心副本</dd>').join('')+'</dl><p class="small-note">面积下界不证明整链能放入实际背包，也不免费提供前料。</p>':'')+(x.unknown.length?'<h3>尚待设计</h3><p>'+x.unknown.map(esc).join('<br>')+'</p>':'')+'<h3>设计来源</h3>'+sourceLinks(x.sources)+'</div></div>';showDetail('object/'+id,fromHash);setFallbacks();
}
function openRecipe(id,fromHash=false){const r=data.recipes.find(x=>x.id===id);if(!r)return;activeId=null;if(!$('detail').open)returnFocus=document.activeElement;$('detail-id').textContent=r.id+' / 炼金配方';const a=by.get(r.artifact);$('detail-content').innerHTML='<div class="recipe-detail"><div class="eyebrow">'+esc(r.process)+' / RECIPE</div><h2 id="detail-title">'+esc(by.get(r.output).name)+'</h2><p class="scope">'+esc(r.scope)+'</p><div class="formula">'+r.inputs.map(i=>chip(i.id,i.quantity)).join('<span>＋</span>')+'<span>→</span>'+chip(r.output,r.quantity)+'</div><div class="recipe-columns"><div><h3>投入职责</h3><dl class="definition">'+r.inputs.map(i=>'<dt>'+esc(by.get(i.id).name)+' × '+i.quantity+'</dt><dd>'+esc(i.role)+'</dd>').join('')+'</dl><p>'+esc(r.reason)+'</p><h3>承载器具</h3>'+chip(r.artifact)+'<p>D'+r.duration+(r.confirmation?'（已确认）':'（候选）')+' · 每批产'+r.quantity+'份（候选）</p><h3>来源</h3>'+sourceLinks(r.sources)+'</div><div><h3>已有局部装载见证</h3>'+grid(a.shape,r.fit.placements)+'<p class="geometry-note">'+r.fit.placements.map((p,i)=>(i+1)+' '+esc(by.get('alchemy.'+p.id).name)).join('　')+'</p><p class="geometry-note">输入'+r.fit.inputArea+'格 / 供料'+r.fit.feedArea+'格<br>只展示此配方的已有几何，不推定全链可启动。</p></div></div></div>';showDetail('recipe/'+id,fromHash)}
function showDetail(hash,fromHash){if(!$('detail').open)$('detail').showModal();$('detail').scrollTop=0;if(!fromHash)history.replaceState(null,'','#'+hash);$('close').focus()}
function closeDetail(){if($('detail').open)$('detail').close();history.replaceState(null,'',state.view==='recipes'?'#recipes':location.pathname+location.search);if(returnFocus?.isConnected)returnFocus.focus()}
function reset(){Object.assign(state,{view:'objects',kind:'all',collection:'all',status:'all',query:'',art:false});render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.object)openObject(b.dataset.object);else if(b.dataset.recipe)openRecipe(b.dataset.recipe);else if(b.dataset.kind){state.kind=b.dataset.kind;state.view='objects';render()}else if(b.dataset.view){state.view=b.dataset.view;state.kind='all';state.collection='all';state.status='all';state.art=false;render()}else if(b.dataset.art!==undefined&&activeId){const x=by.get(activeId);$('art-hero').innerHTML=artMarkup(x,Number(b.dataset.art),true);document.querySelectorAll('[data-art]').forEach(t=>t.setAttribute('aria-pressed',t===b));setFallbacks()}else if(b.hasAttribute('data-reset')||b.id==='reset')reset();else if(b.id==='close')closeDetail()});
$('search').addEventListener('input',e=>{state.query=e.target.value;render()});$('collection').addEventListener('change',e=>{state.collection=e.target.value;render()});$('status').addEventListener('change',e=>{state.status=e.target.value;render()});$('art-only').addEventListener('change',e=>{state.art=e.target.checked;render()});$('detail').addEventListener('cancel',e=>{e.preventDefault();closeDetail()});$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDetail()}});
document.querySelector('.tabs').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();state.view=(e.key==='Home'?'objects':e.key==='End'?'recipes':state.view==='objects'?'recipes':'objects');state.kind='all';state.collection='all';state.status='all';state.art=false;render();$('tab-'+state.view).focus()}});
function route(){const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('object/'))openObject(h.slice(7),true);else if(h.startsWith('recipe/'))openRecipe(h.slice(7),true);else if(h==='recipes'){state.view='recipes';render()}}
$('object-total').textContent=data.items.length;$('recipe-total').textContent=data.recipes.length;$('coverage').textContent=data.items.length+'件物件 · '+data.recipes.length+'条配方 · '+data.items.filter(x=>x.art.length).length+'件有图稿';render();route();window.addEventListener('hashchange',route);
</script></body></html>
